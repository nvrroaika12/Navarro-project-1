<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Aika Navarro initials mark</title>
  <desc id="desc">A rounded lavender square with the initials AN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8dcfa"/>
      <stop offset="1" stop-color="#cfeeff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="174" fill="#785ca8" opacity=".92"/>
  <text x="256" y="286" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="134" font-weight="700" letter-spacing="-12">AN</text>
</svg>
